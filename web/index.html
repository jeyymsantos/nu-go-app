<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NU GO">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" href="Transparent_Logo.png" sizes="any"/>
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="NU GO - Event Management System for NU Baliwag" />
  <meta property="og:description" content="NU GO, developed by Team SYN3RGY as a capstone project for the National University - Baliwag, aims to provide an intuitive platform to organize and monitor events happening within the campus.

It also aims to give platform for its students to easily discover recognized student councils and organizations within the university." />
  <meta property="og:image" content="/assets/assets/images/nugo-logo.png" /> 
  <meta name="twitter:title" content="NU GO - Event Management System for NU Baliwag" />
  <meta name="twitter:description" content="NU GO, developed by Team SYN3RGY as a capstone project for the National University - Baliwag, aims to provide an intuitive platform to organize and monitor events happening within the campus.

It also aims to give platform for its students to easily discover recognized student councils and organizations within the university." />
  <meta name="twitter:image" content="/assets/assets/images/nugo-logo.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> NU GO - Event Management System for NU Baliwag </title>
  <meta name="description" content="NU GO, developed by Team SYN3RGY as a capstone project for the National University - Baliwag, aims to provide an intuitive platform to organize and monitor events happening within the campus.

It also aims to give platform for its students to easily discover recognized student councils and organizations within the university." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">
  
</head>
